server {
    listen 80;
    listen [::]:80;
    server_name kotopad.fun www.kotopad.fun;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/kotopad/acme; }
    location / { return 301 https://kotopad.fun$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.kotopad.fun;
    ssl_certificate /etc/letsencrypt/live/kotopad.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kotopad.fun/privkey.pem;
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://kotopad.fun$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kotopad.fun;
    root /var/www/kotopad/current;
    index index.html;
    server_tokens off;
    autoindex off;
    access_log off;
    error_log /var/log/nginx/kotopad.error.log warn;

    ssl_certificate /etc/letsencrypt/live/kotopad.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kotopad.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

    location = /privacy.html { return 301 /privacy/; }
    location = /support.html { return 301 /support/; }
    location = /terms.html { return 301 /terms/; }
    location = /data.html { return 301 /data/; }
    location = /index.html { return 301 /; }
    location ~ /\. { deny all; }
    location /assets/ {
        try_files $uri =404;
        # Short revalidation avoids stale assets after a release under stable URLs.
        expires 1h;
    }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
